apply plugin: 'com.android.application'

android {
    namespace 'ch.rosenweg4303.karten'
    compileSdk 36

    defaultConfig {
        applicationId "ch.rosenweg4303.karten"
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName "1.6.3"
    }

    // Gleicher Schluessel wie Rosenweg Geraet: Pflicht, sonst gibt dessen AnlageProvider
    // (Permission ch.rosenweg4303.permission.ANLAGE, protectionLevel signature) nichts heraus.
    // keystore.properties hier oder die von android-sip-rosenweg daneben (nie einchecken).
    signingConfigs {
        release {
            def kandidaten = [rootProject.file("keystore.properties"),
                              rootProject.file("../android-sip-rosenweg/keystore.properties")]
            def keystorePropsFile = kandidaten.find { it.exists() }
            if (keystorePropsFile != null) {
                def keystoreProps = new Properties()
                keystoreProps.load(new FileInputStream(keystorePropsFile))
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // Rosenweg-Anmeldung fuer Handys ohne Rosenweg Geraet: gemeinsamer Anmeldeschirm (Karte,
    // Rosenweg-Konto, ab 0.12.0 QR-Code) aus GitHub Packages (Rueckfall mavenLocal)
    implementation 'ch.rosenweg4303:cloud:0.13.4'

    testImplementation 'junit:junit:4.13.2'
}
